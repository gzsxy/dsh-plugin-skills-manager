name: gzsxy/dsh-plugin-skills-manager
category: skill
description:
  en: 'Skill manager panel for DSH Desktop: browse, search, install, update and uninstall Agent Skills in ~/.dsh/skills, with a built-in marketplace (Anthropic official skills, Superpowers, ClawdHub, any GitHub repo), auto Chinese translation of English descriptions, source binding, trash and update checks.'
  zh: 'DSH 技能管理台：浏览、搜索、安装、更新与卸载 ~/.dsh/skills 中的 Agent Skills，内置技能市场（Anthropic 官方技能库、Superpowers、ClawdHub、任意 GitHub 仓库）、英文简介自动中文翻译、来源绑定与回收站。'
